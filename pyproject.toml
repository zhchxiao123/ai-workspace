[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coderfleet"
version = "0.1.2.dev0"
description = "CoderFleet - Run multiple Claude Code/Codex accounts in isolated Docker containers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "aiofiles==24.1.0",
    "python-multipart==0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pywebpush>=2.0.0",
]

[project.scripts]
coderfleet = "coderfleet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["coderfleet"]
