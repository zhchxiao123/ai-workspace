[build-system]
requires = ["hatchling<1.25.0"]
build-backend = "hatchling.build"

[project]
name = "coderfleet"
version = "0.1.17.dev0"
description = "CoderFleet - Run multiple Codex, Claude Code, OpenCode, and Hermes Agent accounts in isolated Docker containers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "aiofiles==24.1.0",
    "python-multipart==0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # mcp pinned to the last release whose own deps stay inside fastapi==0.115.0's
    # starlette<0.39 ceiling; sse-starlette is pinned separately for the same reason
    # (its own starlette floor jumps to >=0.41.3 starting at 2.2.1) — bumping either
    # without first bumping fastapi/starlette will break dependency resolution.
    "mcp==1.12.4",
    "sse-starlette<2.2.0",
    "croniter>=2.0",
    "pywebpush>=2.0.0",
    "edge-tts>=6.1",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pystray>=0.19; sys_platform != 'darwin'",
    "pillow>=10.0; sys_platform != 'darwin'",
    "plyer>=2.1; sys_platform != 'darwin'",
]

[project.scripts]
coderfleet = "coderfleet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["coderfleet"]
