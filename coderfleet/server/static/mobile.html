<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CoderFleet</title>
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CoderFleet">
  <link rel="icon" type="image/png" href="/static/icons/logo-mark.png">
  <link rel="apple-touch-icon" href="/static/icons/logo-mark.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/renderer.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f172a;
      --surface:  #121d2d;
      --surface2: #172338;
      --border:   rgba(255,255,255,.09);
      --text:     #f8fafc;
      --text2:    #b6c4c1;
      --text3:    #7b918d;
      --accent:   #2dd4bf;
      --accent-dk:#0d9488;
      --accent-bg:#134e4a;
      --red:      #dc2626;
      --green:    #4ade80;
      --amber:    #fbbf24;
      --radius:   12px;
      --radius-lg: 16px;
      --mono: 'SF Mono', 'Fira Code', Menlo, monospace;
      /* aliases renderer.css expects */
      --surface-2:  #172338;
      --text-2:     #b6c4c1;
      --text-3:     #7b918d;
      --border-md:  rgba(255,255,255,.16);
      /* log panel vars */
      --log-bg:       #111827;
      --log-card:     #17202b;
      --log-card-soft:#141c27;
      --log-line:     rgba(148,163,184,.22);
      /* bubble vars (dark mode) */
      --bubble-bg:         #121d2d;
      --bubble-color:      #f8fafc;
      --bubble-border:     rgba(255,255,255,.09);
      --bubble-think-bg:   #172338;
      --bubble-think-color:#7b918d;
      --bubble-code-bg:    rgba(13,148,136,.08);
      --bubble-code-color: #2dd4bf;
      --bubble-pre-bg:     #172338;
      --bubble-pre-color:  #f8fafc;
      --st: env(safe-area-inset-top,    0px);
      --sb: env(safe-area-inset-bottom, 0px);
      --app-height: 100dvh;
      --keyboard-offset: 0px;
    }

    html {
      height: -webkit-fill-available;
    }

    html, body {
      height: 100%;
      width: 100%;
      max-width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      height: var(--app-height);
    }

    /* ── Views ─────────────────────────────────────────── */
    .view {
      position: fixed;
      top: 0; right: 0; bottom: auto; left: 0;
      width: 100%;
      max-width: 100vw;
      height: var(--app-height);
      max-height: var(--app-height);
      display: flex; flex-direction: column;
      background: var(--bg);
      overflow: hidden;
      transition: transform .26s cubic-bezier(.4,0,.2,1);
      will-change: transform;
    }
    .view.slide-out { transform: translateX(100%); }

    /* ── Header ─────────────────────────────────────────── */
    .hdr {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--st) + 10px) 8px 10px;
      display: flex; align-items: center; gap: 4px;
    }
    .hdr-title   { font-size: 17px; font-weight: 600; flex: 1; min-width: 0;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-sub     { font-size: 12px; color: var(--text3); margin-top: 1px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn {
      background: none; border: none; color: var(--accent);
      padding: 8px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { background: var(--surface2); }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }

    /* ── Conversation list ──────────────────────────────── */
    .list-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    }
    .proj-label {
      padding: 10px 14px 5px;
      font-size: 11px; font-weight: 700; letter-spacing: .06em;
      color: var(--text3); text-transform: uppercase;
      position: sticky; top: 0; background: var(--bg); z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .proj-title {
      display: flex; align-items: center; gap: 7px;
      min-width: 0; flex: 1;
    }
    .proj-title span:last-child {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .proj-toggle {
      width: 12px; flex-shrink: 0;
      color: var(--text3); font-size: 12px; line-height: 1;
    }
    .proj-new-btn {
      background: none; border: none; color: var(--accent);
      font-size: 20px; font-weight: 300; line-height: 1;
      padding: 2px 6px; border-radius: 6px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .proj-new-btn:active { background: var(--surface); }
    .proj-empty,
    .proj-more {
      margin-left: 16px;
      padding: 10px 16px 11px;
      border-bottom: 1px solid var(--border);
      color: var(--text3);
      font-size: 13px;
    }
    .proj-more {
      width: calc(100% - 16px);
      text-align: left;
      background: none;
      border-top: 0; border-left: 0; border-right: 0;
      color: var(--accent);
      font-weight: 650;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .proj-more:active { background: var(--surface); }
    .conv-row {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .conv-row:active { background: var(--surface); }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent-bg); color: var(--accent);
      font-size: 18px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .conv-info   { flex: 1; min-width: 0; }
    .conv-name   { font-size: 15px; font-weight: 500;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-meta   { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .pill {
      font-size: 11px; font-weight: 600; padding: 3px 8px;
      border-radius: 20px; flex-shrink: 0;
    }
    .pill-run  { background: var(--accent-bg); color: var(--accent); }
    .pill-fail { background: rgba(220,38,38,.18); color: #f87171; }

    /* ── Chat bubbles ───────────────────────────────────── */
    .chat-body {
      flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      padding: 14px 14px 8px;
      display: flex; flex-direction: column; gap: 22px;
    }
    .empty-hint {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: var(--text3); font-size: 14px;
      padding-bottom: 60px;
    }
    .empty-hint .ei { font-size: 52px; opacity: .35; }

    .msg-pair { display: flex; flex-direction: column; gap: 6px; }

    /* User bubble — right */
    .msg-user { display: flex; justify-content: flex-end; }
    .user-msg-stack {
      max-width: 82%;
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 8px;
    }
    .user-bubble {
      background: var(--accent-dk); color: #fff;
      border-radius: 18px 18px 4px 18px;
      padding: 10px 14px;
      width: fit-content; max-width: 100%;
      font-size: 15px; line-height: 1.5;
      white-space: normal; word-break: normal;
    }
    .user-bubble-text {
      white-space: pre-wrap; word-break: break-word;
    }
    .user-image-attachments {
      display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
      max-width: 100%;
    }
    .user-image-attachment {
      width: 84px; height: 84px;
      border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border-md);
      background: var(--surface2);
      display: block; flex-shrink: 0;
    }
    .user-image-attachment img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    /* AI 渲染器容器 */
    .ai-log-wrap {
      min-width: 0;
      max-width: 100%;
      overflow-x: hidden;
      padding: 2px 0 4px;
    }
    .thinking-indicator {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0; color: var(--text3); font-size: 14px;
    }
    .tdots span {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent); margin: 0 1px;
      animation: tdot 1.1s infinite;
    }
    .tdots span:nth-child(2) { animation-delay: .18s; }
    .tdots span:nth-child(3) { animation-delay: .36s; }
    @keyframes tdot { 0%,80%,100%{transform:scale(.55);opacity:.4} 40%{transform:scale(1);opacity:1} }
    .ai-log-wrap .chat-log.timeline { max-width: 100%; }

    /* ── Input bar ──────────────────────────────────────── */
    .input-bar {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 10px calc(var(--sb) + 8px);
      display: flex; flex-direction: column; align-items: stretch; gap: 6px;
      width: 100%;
      max-width: 100%;
      transform: translateY(calc(-1 * var(--keyboard-offset)));
      transition: transform .16s ease;
      will-change: transform;
    }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
      width: 100%; min-width: 0;
    }
    .upload-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .upload-btn:active { border-color: var(--accent-dk); color: var(--accent); }
    .upload-btn svg { width: 19px; height: 19px; stroke-width: 2; }
    .input-bar textarea {
      flex: 1;
      min-width: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text); font-family: inherit;
      font-size: 16px; line-height: 1.4;
      padding: 9px 15px;
      resize: none; outline: none;
      max-height: 130px; overflow-y: auto; overflow-x: hidden;
    }
    .input-bar textarea:focus { border-color: var(--accent-dk); }
    .input-bar textarea::placeholder { color: var(--text3); }
    .btn-send {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent-dk); border: none; color: #fff;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-send:disabled { opacity: .35; }
    .btn-send:active:not(:disabled) { transform: scale(.9); }
    .btn-send svg { width: 18px; height: 18px; stroke-width: 2.2; }
    .image-preview-row {
      display: flex; flex-wrap: wrap; gap: 8px;
      max-height: 78px; overflow-y: auto; overflow-x: hidden;
      padding: 0 2px 2px 2px;
    }
    .image-thumb {
      position: relative;
      width: 58px; height: 58px;
      border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border-md);
      background: var(--surface2);
      flex-shrink: 0;
    }
    .image-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .image-remove {
      position: absolute; top: 2px; right: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      border: 0; padding: 0;
      background: rgba(0,0,0,.62); color: #fff;
      font-size: 13px; line-height: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .upload-status {
      display: none;
      padding: 0 4px;
      color: var(--text3);
      font-size: 12px;
    }

    /* ── Bottom sheet ───────────────────────────────────── */
    .backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 100;
      display: none; align-items: flex-end;
    }
    .backdrop.open { display: flex; }
    .sheet {
      background: var(--surface);
      border-radius: 18px 18px 0 0;
      width: 100%; max-height: 72dvh;
      display: flex; flex-direction: column;
      padding-bottom: var(--sb);
      animation: sheetUp .24s cubic-bezier(.4,0,.2,1);
    }
    @keyframes sheetUp { from{transform:translateY(100%)} to{transform:none} }
    .sheet-handle {
      width: 38px; height: 4px; border-radius: 2px;
      background: var(--border);
      margin: 10px auto 6px; flex-shrink: 0;
    }
    .sheet-ttl {
      font-size: 13px; font-weight: 600; color: var(--text3);
      text-align: center; padding: 0 16px 10px;
      flex-shrink: 0;
    }
    .sheet-search {
      padding: 8px 14px 10px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .sheet-search input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 16px;
      padding: 8px 12px; outline: none;
    }
    .sheet-search input:focus { border-color: var(--accent-dk); }
    .sheet-search input::placeholder { color: var(--text3); }
    .sheet-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .sheet-row {
      display: flex; align-items: center; gap: 12px;
      padding: 15px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .sheet-row:active { background: var(--surface2); }
    .sheet-icon {
      width: 38px; height: 38px; border-radius: 9px;
      background: var(--accent-bg); color: var(--accent);
      font-size: 17px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sheet-name { font-size: 15px; font-weight: 500; }
    .sheet-sub  { font-size: 12px; color: var(--text3); margin-top: 2px; }
    #notif-btn.subscribed svg { stroke: var(--accent); fill: rgba(45,212,191,.15); }
  </style>
</head>
<body>

<!-- ── 会话列表 ──────────────────────────────────────── -->
<div class="view" id="v-list">
  <div class="hdr">
    <div style="flex:1;min-width:0;padding-left:8px">
      <div class="hdr-title">CoderFleet</div>
      <div class="hdr-sub" id="health-lbl">连接中…</div>
    </div>
    <button class="icon-btn" id="notif-btn" onclick="togglePushSubscription()" title="开启推送通知" style="display:none">
      <svg id="notif-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </div>

  <div class="list-scroll" id="conv-list">
    <div class="empty-hint">
      <div class="ei">💬</div>
      <div>加载中…</div>
    </div>
  </div>

</div>

<!-- ── 聊天视图 ──────────────────────────────────────── -->
<div class="view slide-out" id="v-chat">
  <div class="hdr">
    <button class="icon-btn" onclick="backToList()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </button>
    <div style="flex:1;min-width:0">
      <div class="hdr-title" id="chat-ttl">对话</div>
      <div class="hdr-sub"   id="chat-sub"></div>
    </div>
  </div>

  <div class="chat-body" id="chat-body">
    <div class="empty-hint" id="chat-empty">
      <div class="ei">🤖</div>
      <div>发送消息，开始对话</div>
    </div>
  </div>

  <div class="input-bar">
    <div class="image-preview-row" id="image-previews" style="display:none"></div>
    <div class="input-row">
      <input type="file" id="image-file" accept="image/*" multiple style="display:none" onchange="handleImageSelect(this)">
      <button class="upload-btn" type="button" title="选择图片" onclick="document.getElementById('image-file').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </button>
      <textarea id="ta" rows="1" placeholder="输入任务描述…"
        oninput="onInput(this)" onkeydown="onKey(event)"></textarea>
      <button class="btn-send" id="btn-send" disabled onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <div class="upload-status" id="upload-status"></div>
  </div>
</div>

<!-- ── 项目选择底部弹层 ──────────────────────────────── -->
<div class="backdrop" id="proj-sheet" onclick="closeSheet()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-ttl">选择项目开启新对话</div>
    <div class="sheet-search">
      <input id="proj-search" type="search" placeholder="搜索项目…"
        oninput="renderProjSheet(this.value)" autocomplete="off" autocorrect="off">
    </div>
    <div class="sheet-scroll" id="proj-list"></div>
  </div>
</div>

<!-- 依赖脚本必须在主逻辑 script 之前加载（移动端 giant inline script 在此之后），否则 renderPendingPreviews 等共享函数未定义会导致发送/上传时崩溃 -->
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/js/utils.js?v=20260525-auth"></script>
<script src="/static/js/shared/project-utils.js?v=20260527-shared"></script>
<script src="/static/js/shared/image-upload.js?v=20260528-imagefix"></script>
<script src="/static/js/renderer.js"></script>

<script>
// ── State ────────────────────────────────────────────────
let projects  = [];
let convs     = [];
let tasks     = [];
let activeConv    = null;   // Conversation object (ongoing chat)
let pendingProj   = null;   // Project selected for new chat (before first send)
let liveStream    = null;   // Active EventSource
const PROJECT_VISIBLE_LIMIT = 5;
const expandedProjects = new Set();
const collapsedProjects = new Set();
let stableAppHeight = 0;
let pendingImages = [];
let uploadingImages = 0;

function setViewportVars() {
  const vv = window.visualViewport;
  const layoutHeight = Math.round(Math.max(
    document.documentElement.clientHeight || 0,
    window.innerHeight || 0,
    vv ? vv.height + vv.offsetTop : 0,
  ));
  const visibleHeight = Math.round(vv?.height || window.innerHeight || layoutHeight);
  const viewportTop = Math.round(vv?.offsetTop || 0);
  const keyboardOffset = vv
    ? Math.max(0, layoutHeight - visibleHeight - viewportTop)
    : 0;
  const keyboardOpen = keyboardOffset > 80;

  if (!stableAppHeight || !keyboardOpen) {
    stableAppHeight = layoutHeight;
  }

  document.documentElement.style.setProperty('--app-height', `${stableAppHeight}px`);
  document.documentElement.style.setProperty('--keyboard-offset', `${keyboardOpen ? keyboardOffset : 0}px`);

  if (keyboardOpen) {
    window.scrollTo(0, 0);
  }
}

setViewportVars();
window.addEventListener('resize', setViewportVars);
window.addEventListener('orientationchange', () => {
  stableAppHeight = 0;
  setTimeout(setViewportVars, 80);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', setViewportVars);
  window.visualViewport.addEventListener('scroll', setViewportVars);
}

// ── Bootstrap（由 utils.js 加载后触发，见页尾 script）────
async function initApp() {
  await refresh();
  setInterval(checkHealth, 12000);
  setInterval(bgRefresh, 7000);
  const textarea = document.getElementById('ta');
  textarea.addEventListener('input', () => {
    updateSendState();
  });
  textarea.addEventListener('paste', handlePaste);
  textarea.addEventListener('focus', () => setTimeout(setViewportVars, 60));
  textarea.addEventListener('blur', () => setTimeout(setViewportVars, 120));
}

async function refresh() {
  await checkHealth();
  try {
    [projects, convs, tasks] = await Promise.all([
      api('/api/projects'),
      api('/api/conversations'),
      api('/api/tasks?limit=600'),
    ]);
    renderList();
  } catch {}
}

async function bgRefresh() {
  try {
    [convs, tasks] = await Promise.all([
      api('/api/conversations'),
      api('/api/tasks?limit=600'),
    ]);
    renderList();
    if (activeConv && !isListVisible()) syncMessages(false);
  } catch {}
}

async function checkHealth() {
  try {
    await api('/api/health');
    setLbl('已连接', true);
  } catch {
    setLbl('未连接', false);
  }
}

function setLbl(t, ok) {
  const el = document.getElementById('health-lbl');
  el.textContent = t;
  el.style.color = ok ? 'var(--accent)' : 'var(--red)';
}

// ── Conversation list ─────────────────────────────────────
function renderList() {
  const el = document.getElementById('conv-list');
  if (!projects.length) {
    el.innerHTML = '<div class="empty-hint"><div class="ei">💬</div><div>暂无项目配置</div></div>';
    return;
  }

  el.innerHTML = projects.map(proj => {
    const list = convs
      .filter(c => (window.conversationBelongsToProject || conversationBelongsToProject)(c, proj))
      .sort((a, b) => convTimeValue(b) - convTimeValue(a));
    const isCollapsed = collapsedProjects.has(proj.name);
    const isExpanded = expandedProjects.has(proj.name);
    const visible = isExpanded ? list : list.slice(0, PROJECT_VISIBLE_LIMIT);
    const hiddenCount = Math.max(0, list.length - visible.length);
    const encodedName = encodeURIComponent(proj.name).replace(/'/g, '%27');
    const projJson = JSON.stringify(proj).replace(/"/g,'&quot;');
    const body = isCollapsed
      ? ''
      : list.length
        ? `${visible.map(c => convRow(c)).join('')}${hiddenCount ? `
      <button class="proj-more" onclick="event.stopPropagation();toggleProjectItems('${encodedName}')">
        ${isExpanded ? '收起' : `展开显示 ${hiddenCount} 个`}
      </button>` : ''}`
        : '<div class="proj-empty">暂无对话</div>';
    return `
      <div class="proj-label" onclick="toggleProjectGroup('${encodedName}')">
        <div class="proj-title">
          <span class="proj-toggle">${isCollapsed ? '+' : '-'}</span>
          <span>${x(proj.name)}</span>
        </div>
        <button class="proj-new-btn" title="新建对话"
          onclick="event.stopPropagation();startNew(${projJson})">+</button>
      </div>
      ${body}
    `;
  }).join('');
}

function convRow(c) {
  const ct = tasks
    .filter(t => t.conversation_id === c.id)
    .sort((a, b) => new Date(b.created || 0) - new Date(a.created || 0));
  const latest = ct[0];
  const st = latest?.status ?? 'done';
  const isRun  = ['running','pending','scheduled'].includes(st);
  const isFail = ['failed','killed'].includes(st);
  const badge  = isRun  ? `<span class="pill pill-run">运行中</span>`
               : isFail ? `<span class="pill pill-fail">失败</span>`
               : '';
  return `<div class="conv-row" onclick="openConv('${c.id}')">
    <div class="avatar">${x(c.name[0]?.toUpperCase() ?? '?')}</div>
    <div class="conv-info">
      <div class="conv-name">${x(c.name)}</div>
      <div class="conv-meta">${x(relTime(c.updated))}${ct.length ? ` · ${ct.length} 条` : ''}</div>
    </div>
    ${badge}
  </div>`;
}

// 项目归属函数已统一从 shared/project-utils.js 提供（全局）
// convBelongsToProject / projectPathContains 来自 shared/project-utils.js（已提前加载）

function convTimeValue(c) {
  return new Date(c.updated || c.created || 0).getTime() || 0;
}

function toggleProjectGroup(encodedName) {
  const name = decodeURIComponent(encodedName);
  if (collapsedProjects.has(name)) collapsedProjects.delete(name);
  else collapsedProjects.add(name);
  renderList();
}

function toggleProjectItems(encodedName) {
  const name = decodeURIComponent(encodedName);
  if (expandedProjects.has(name)) expandedProjects.delete(name);
  else expandedProjects.add(name);
  renderList();
}

// ── Open conversation ─────────────────────────────────────
function openConv(id) {
  activeConv  = convs.find(c => c.id === id) || null;
  pendingProj = null;
  if (!activeConv) return;

  document.getElementById('chat-ttl').textContent = activeConv.name;
  document.getElementById('chat-sub').textContent = activeConv.project_name || activeConv.project || '';
  showChat();
  syncMessages(true);
}

// ── Bubble rendering ──────────────────────────────────────
function syncMessages(scrollEnd) {
  const body  = document.getElementById('chat-body');
  const empty = document.getElementById('chat-empty');
  const ct    = tasks
    .filter(t => t.conversation_id === activeConv?.id)
    .sort((a, b) => new Date(a.created || 0) - new Date(b.created || 0));

  if (!ct.length) { empty.style.display = 'flex'; return; }
  empty.style.display = 'none';

  ct.forEach(task => {
    if (!document.getElementById(`mp-${task.id}`)) {
      body.appendChild(makeMsgPair(task));
      loadAiContent(task);
    }
  });

  body.querySelectorAll('.msg-pair').forEach(el => {
    if (!ct.find(t => `mp-${t.id}` === el.id)) el.remove();
  });

  if (scrollEnd) body.scrollTop = body.scrollHeight;
}

function makeMsgPair(task) {
  const div = document.createElement('div');
  div.className = 'msg-pair';
  div.id = `mp-${task.id}`;
  div.innerHTML = `
    <div class="msg-user">
      <div class="user-msg-stack">
        <div class="user-bubble">
          <div class="user-bubble-text">${x(task.prompt)}</div>
        </div>
        ${renderTaskImages(task)}
      </div>
    </div>
    <div class="ai-log-wrap" id="ab-${task.id}">
      <div class="thinking-indicator">
        <div class="tdots"><span></span><span></span><span></span></div>
        <span>正在执行…</span>
      </div>
    </div>
  `;
  return div;
}

async function loadAiContent(task) {
  const wrap = document.getElementById(`ab-${task.id}`);
  if (!wrap) return;

  if (task.status === 'running') {
    streamAiContent(task.id, wrap);
    return;
  }
  if (['pending', 'scheduled'].includes(task.status)) return;

  try {
    const txt = await fetch(`/api/tasks/${task.id}/logs`).then(r => r.text());
    const renderer = new ChatLogRenderer(wrap, false, true);
    renderer.render(stripAnsi(txt));
  } catch { wrap.textContent = '加载失败'; }
}

function streamAiContent(id, wrap) {
  if (liveStream) { liveStream.close(); liveStream = null; }
  const renderer = new ChatLogRenderer(wrap, true, true);
  renderer.renderPending();
  const body = document.getElementById('chat-body');
  const es = new EventSource(sseUrl(`/api/tasks/${id}/logs/stream?tail=0`));
  es.taskId = id;
  liveStream = es;
  es.onmessage = e => {
    if (e.data === '[DONE]') { es.close(); liveStream = null; bgRefresh(); return; }
    renderer.push(stripAnsi(e.data));
    body.scrollTop = body.scrollHeight;
  };
  es.onerror = () => {
    es.close(); liveStream = null;
    bgRefresh();
  };
}

// ── Send ─────────────────────────────────────────────────
async function send() {
  const ta   = document.getElementById('ta');
  let prompt = ta.value.trim();
  if (!prompt && pendingImages.length === 0) return;
  if (!prompt && pendingImages.length > 0) prompt = '请查看附件图片。';
  if (uploadingImages > 0) {
    alert('图片还在上传中，请稍后再发送');
    return;
  }

  const btn = document.getElementById('btn-send');
  btn.disabled = true;
  ta.value = '';
  ta.style.height = '';

  try {
    let body;
    if (activeConv) {
      body = {
        prompt,
        project:      activeConv.project,
        project_name: activeConv.project_name,
        account:      activeConv.account,
        conversation_id: activeConv.id,
        auto: true,
        images: pendingImages.map(i => i.container_path),
      };
    } else if (pendingProj) {
      const name = prompt.slice(0, 28) + (prompt.length > 28 ? '…' : '');
      body = {
        prompt,
        project:           pendingProj.path,
        project_name:      pendingProj.name,
        account:           pendingProj.account,
        conversation_name: name,
        auto: true,
        images: pendingImages.map(i => i.container_path),
      };
    } else { return; }

    const task = await api('/api/tasks', { method:'POST', body });
    tasks.unshift(task);
    pendingImages = [];
    if (typeof renderImagePreviews === 'function') {
      renderImagePreviews();
    } else {
      const c = document.getElementById('image-previews');
      if (c) { c.style.display = 'none'; c.innerHTML = ''; }
    }

    // If new chat, attach to the created conversation
    if (!activeConv && task.conversation_id) {
      convs = await api('/api/conversations').catch(() => convs);
      activeConv = convs.find(c => c.id === task.conversation_id) || null;
      pendingProj = null;
      if (activeConv) {
        document.getElementById('chat-ttl').textContent = activeConv.name;
        document.getElementById('chat-sub').textContent = activeConv.project_name || '';
      }
    }
    syncMessages(true);
  } catch (err) {
    alert('发送失败：' + (err.message || err));
    updateSendState();
  }
}

async function handleImageSelect(input) {
  const files = Array.from(input.files || []);
  input.value = '';
  if (files.length) await uploadImages(files);
}

async function handlePaste(event) {
  const files = Array.from(event.clipboardData?.items || [])
    .filter(item => item.kind === 'file' && item.type.startsWith('image/'))
    .map(item => item.getAsFile())
    .filter(Boolean);
  if (!files.length) return;
  event.preventDefault();
  await uploadImages(files, true);
}

async function uploadImages(files, fromPaste = false) {
  if (typeof uploadImagesForCompose === 'function') {
    // Phase 2: 复用共享的 uploadImagesForCompose（消除与 chat.js 的重复 wrapper）
    await uploadImagesForCompose(files, fromPaste, {
      getProjectName: () => currentUploadProjectName(),
      onItemUploaded: (item) => {
        if (!Array.isArray(pendingImages)) pendingImages = [];
        pendingImages.push(item);
        renderImagePreviews();
      },
      onProgressChange: (count) => {
        uploadingImages = count;
        updateUploadState();
      },
      onError: (msg) => alert('上传图片失败：' + msg),
      getApiBase: () => '',
    });
    return;
  }

  if (typeof uploadImagesGeneric !== 'function') {
    alert('图片上传组件未就绪，请刷新页面后重试');
    return;
  }

  const projectName = currentUploadProjectName();
  if (!projectName) {
    alert('请先选择项目后再上传图片');
    return;
  }

  await uploadImagesGeneric(projectName, files, fromPaste, {
    onFileUploaded: (item) => {
      if (!Array.isArray(pendingImages)) pendingImages = [];
      pendingImages.push(item);
      renderImagePreviews();
    },
    onProgressChange: (count) => {
      uploadingImages = count;
      updateUploadState();
    },
    onError: (msg) => alert('上传图片失败：' + msg),
    getApiBase: () => '',
  });
}

// normalizeImageFileForUpload / uploadImagesGeneric 由 shared/image-upload.js 提供

// Phase 2 去重：使用共享的 renderPendingPreviews（mobile 配置）
function renderImagePreviews() {
  if (typeof renderPendingPreviews === 'function') {
    renderPendingPreviews({
      containerId: 'image-previews',
      thumbClass: 'image-thumb',
      removeClass: 'image-remove',
      getImages: () => pendingImages,
      removeImage: (index) => pendingImages.splice(index, 1),
      clearImages: () => { pendingImages = []; },
      afterRender: () => updateSendState(),
      getSseUrl: (u) => (typeof x === 'function' && typeof sseUrl === 'function' ? x(sseUrl(u)) : u),
      getApi: () => '',
      escFn: (s) => (typeof x === 'function' ? x(s) : String(s || '')),
    });
  } else {
    // 防御：共享脚本尚未加载或加载失败时避免崩溃（此时预览区简单隐藏即可）
    const container = document.getElementById('image-previews');
    if (container) {
      container.style.display = 'none';
      container.innerHTML = '';
    }
    updateSendState();
  }
}

// removePendingImage / clearPendingImages 由 shared 提供（全局）
// 它们会自动回退调用 renderImagePreviews

function updateUploadState() {
  const status = document.getElementById('upload-status');
  if (status) {
    status.style.display = uploadingImages > 0 ? 'block' : 'none';
    status.textContent = uploadingImages > 0 ? `正在上传 ${uploadingImages} 张图片…` : '';
  }
  updateSendState();
}

function updateSendState() {
  const ta = document.getElementById('ta');
  const btn = document.getElementById('btn-send');
  if (!btn || !ta) return;
  btn.disabled = uploadingImages > 0 || (ta.value.trim() === '' && pendingImages.length === 0);
}

function currentUploadProjectName() {
  if (activeConv?.project_name) return activeConv.project_name;
  if (activeConv?.project) {
    const fn = window.projectPathContains || projectPathContains;
    const proj = projects.find(p => fn && fn(p.path, activeConv.project));
    if (proj) return proj.name;
  }
  return pendingProj?.name || '';
}

function renderTaskImages(task) {
  // 由 shared/image-upload.js 提供（脚本加载顺序保证调用时已就绪）
  if (window.renderTaskImageAttachments) {
    return window.renderTaskImageAttachments(task, currentUploadProjectName());
  }
  return '';
}

// ── New chat (via proj header button) ────────────────────

function renderProjSheet(query) {
  const q = query.toLowerCase().trim();
  const filtered = q
    ? projects.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.account.toLowerCase().includes(q))
    : projects;

  const list = document.getElementById('proj-list');
  if (!filtered.length) {
    list.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text3);font-size:14px">无匹配项目</div>`;
    return;
  }
  list.innerHTML = filtered.map(p => `
    <div class="sheet-row" onclick="startNew(${JSON.stringify(p).replace(/"/g,'&quot;')})">
      <div class="sheet-icon">${x(p.name[0]?.toUpperCase() ?? '?')}</div>
      <div>
        <div class="sheet-name">${x(p.name)}</div>
        <div class="sheet-sub">${x(p.account)}</div>
      </div>
    </div>
  `).join('');
}

function startNew(proj) {
  closeSheet();
  pendingProj = proj;
  activeConv  = null;

  document.getElementById('chat-ttl').textContent = '新对话';
  document.getElementById('chat-sub').textContent = proj.name;
  document.getElementById('chat-body').querySelectorAll('.msg-pair').forEach(el => el.remove());
  document.getElementById('chat-empty').style.display = 'flex';
  showChat();
  document.getElementById('ta').focus();
}

function closeSheet() {
  document.getElementById('proj-sheet').classList.remove('open');
}

// ── Navigation ────────────────────────────────────────────
function showChat() {
  document.getElementById('v-chat').classList.remove('slide-out');
}

function backToList() {
  if (liveStream) { liveStream.close(); liveStream = null; }
  document.getElementById('v-chat').classList.add('slide-out');
  renderList();
}

function isListVisible() {
  return document.getElementById('v-chat').classList.contains('slide-out');
}

// ── Input helpers ─────────────────────────────────────────
function onInput(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 130) + 'px';
}

function onKey(e) {
  // Desktop: Enter to send, Shift+Enter for newline
  if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) {
    e.preventDefault();
    send();
  }
}

// ── Utils ─────────────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

// x / stripAnsi / relTime 已统一由 utils.js 提供（移动端与桌面共享）

if (window.innerWidth > 768) {
  location.replace('/');
}

// ── Web Push ──────────────────────────────────────────────

let _vapidPublicKey = null;
let _pushSubscription = null;

async function initPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const btn = document.getElementById('notif-btn');
  try {
    const res = await fetch('/api/push/vapid-public-key');
    if (!res.ok) return;
    const { publicKey } = await res.json();
    _vapidPublicKey = publicKey;
    btn.style.display = '';
    const reg = await navigator.serviceWorker.ready;
    _pushSubscription = await reg.pushManager.getSubscription();
    updateNotifBtn();
  } catch {}
}

function updateNotifBtn() {
  const btn = document.getElementById('notif-btn');
  if (_pushSubscription) {
    btn.classList.add('subscribed');
    btn.title = '已开启推送通知（点击关闭）';
  } else {
    btn.classList.remove('subscribed');
    btn.title = '开启推送通知';
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function togglePushSubscription() {
  if (!_vapidPublicKey) return;
  const reg = await navigator.serviceWorker.ready;
  if (_pushSubscription) {
    await _pushSubscription.unsubscribe();
    await fetch('/api/push/unsubscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint: _pushSubscription.endpoint }),
    }).catch(() => {});
    _pushSubscription = null;
    updateNotifBtn();
    return;
  }
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    alert('需要通知权限才能接收推送。请在浏览器设置中允许通知。');
    return;
  }
  try {
    _pushSubscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(_vapidPublicKey),
    });
    await fetch('/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: _pushSubscription.toJSON() }),
    });
    updateNotifBtn();
  } catch (e) {
    alert('订阅推送失败：' + e.message);
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(() => initPush())
    .catch(() => {});
}
