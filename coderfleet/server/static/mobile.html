<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>
    (function(){var s=localStorage.getItem('cf-theme');if(s){document.documentElement.setAttribute('data-theme',s);}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.setAttribute('data-theme','light');}})();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CoderFleet</title>
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CoderFleet">
  <link rel="icon" type="image/png" href="/static/icons/logo-mark.png">
  <link rel="apple-touch-icon" href="/static/icons/logo-mark.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/renderer.css">
  <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f172a;
      --surface:  #121d2d;
      --surface2: #172338;
      --border:   rgba(255,255,255,.09);
      --text:     #f8fafc;
      --text2:    #b6c4c1;
      --text3:    #7b918d;
      --accent:   #2dd4bf;
      --accent-dk:#0d9488;
      --accent-bg:#134e4a;
      --red:      #dc2626;
      --green:    #4ade80;
      --amber:    #fbbf24;
      --radius:   12px;
      --radius-lg: 16px;
      --mono: 'SF Mono', 'Fira Code', Menlo, monospace;
      /* aliases renderer.css expects */
      --surface-2:  #172338;
      --text-2:     #b6c4c1;
      --text-3:     #7b918d;
      --border-md:  rgba(255,255,255,.16);
      /* log panel vars */
      --log-bg:       #111827;
      --log-card:     #17202b;
      --log-card-soft:#141c27;
      --log-line:     rgba(148,163,184,.22);
      /* bubble vars (dark mode) */
      --bubble-bg:         #121d2d;
      --bubble-color:      #f8fafc;
      --bubble-border:     rgba(255,255,255,.09);
      --bubble-think-bg:   #172338;
      --bubble-think-color:#7b918d;
      --bubble-code-bg:    rgba(13,148,136,.08);
      --bubble-code-color: #2dd4bf;
      --bubble-pre-bg:     #172338;
      --bubble-pre-color:  #f8fafc;
      --st: env(safe-area-inset-top,    0px);
      --sb: env(safe-area-inset-bottom, 0px);
      --app-height: 100dvh;
      --keyboard-offset: 0px;
    }

    html[data-theme="light"] {
      --bg:       #eef7f5;
      --surface:  #ffffff;
      --surface2: #f7fbfa;
      --border:   rgba(19,78,74,.12);
      --text:     #102a27;
      --text2:    #45615d;
      --text3:    #718783;
      --accent:   #0d9488;
      --accent-dk:#0f766e;
      --accent-bg:#ccfbf1;
      --red:      #dc2626;
      --green:    #15803d;
      --amber:    #b45309;
      --surface-2:  #f7fbfa;
      --text-2:     #45615d;
      --text-3:     #718783;
      --border-md:  rgba(19,78,74,.24);
      --log-bg:       #f0f4f8;
      --log-card:     #e4edf5;
      --log-card-soft:#e9f0f7;
      --log-line:     rgba(19,78,74,.14);
      --bubble-bg:         #ffffff;
      --bubble-color:      #102a27;
      --bubble-border:     rgba(19,78,74,.12);
      --bubble-think-bg:   #f7fbfa;
      --bubble-think-color:#718783;
      --bubble-code-bg:    rgba(13,148,136,.06);
      --bubble-code-color: #0d9488;
      --bubble-pre-bg:     #f7fbfa;
      --bubble-pre-color:  #102a27;
    }

    html {
      height: -webkit-fill-available;
    }

    /* ── 自定义滚动条（主题适配）─── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-corner { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }
    html[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.14); }
    html[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.26); }
    html[data-theme="light"] { scrollbar-color: rgba(0,0,0,0.14) transparent; scrollbar-width: thin; }
    html[data-theme="dark"]  { scrollbar-color: rgba(255,255,255,0.16) transparent; scrollbar-width: thin; }

    html, body {
      height: 100%;
      width: 100%;
      max-width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      height: var(--app-height);
    }

    /* ── Views ─────────────────────────────────────────── */
    .view {
      position: fixed;
      top: 0; right: 0; bottom: auto; left: 0;
      width: 100%;
      max-width: 100vw;
      height: var(--app-height);
      max-height: var(--app-height);
      display: flex; flex-direction: column;
      background: var(--bg);
      overflow: hidden;
      transition: transform .26s cubic-bezier(.4,0,.2,1);
      will-change: transform;
    }
    .view.slide-out { transform: translateX(100%); }

    /* ── Header ─────────────────────────────────────────── */
    .hdr {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--st) + 10px) 8px 10px;
      display: flex; align-items: center; gap: 4px;
    }
    .hdr-title   { font-size: 17px; font-weight: 600; flex: 1; min-width: 0;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-sub     { font-size: 12px; color: var(--text3); margin-top: 1px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn {
      background: none; border: none; color: var(--accent);
      padding: 8px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { background: var(--surface2); }
    .icon-btn:disabled { opacity: .45; cursor: not-allowed; }
    .icon-btn:disabled:active { background: none; }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }

    /* ── Conversation list ──────────────────────────────── */
    .list-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    }
    .proj-label {
      padding: 10px 14px 5px;
      font-size: 11px; font-weight: 700; letter-spacing: .06em;
      color: var(--text3); text-transform: uppercase;
      position: sticky; top: 0; background: var(--bg); z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .proj-title {
      display: flex; align-items: center; gap: 7px;
      min-width: 0; flex: 1;
    }
    .proj-title span:last-child {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .proj-toggle {
      width: 12px; flex-shrink: 0;
      color: var(--text3); font-size: 12px; line-height: 1;
    }
    .proj-new-btn {
      background: none; border: none; color: var(--accent);
      font-size: 20px; font-weight: 300; line-height: 1;
      padding: 2px 6px; border-radius: 6px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .proj-new-btn:active { background: var(--surface); }
    .proj-term-btn {
      background: none; border: none; color: var(--text3);
      font: 700 12px var(--mono);
      padding: 5px 7px; border-radius: 6px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .proj-term-btn:active { background: var(--surface); color: var(--accent); }
    .proj-empty,
    .proj-more {
      margin-left: 16px;
      padding: 10px 16px 11px;
      border-bottom: 1px solid var(--border);
      color: var(--text3);
      font-size: 13px;
    }
    .proj-more {
      width: calc(100% - 16px);
      text-align: left;
      background: none;
      border-top: 0; border-left: 0; border-right: 0;
      color: var(--accent);
      font-weight: 650;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .proj-more:active { background: var(--surface); }
    .conv-row {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .conv-row:active { background: var(--surface); }
    .row-action {
      width: 32px; height: 32px;
      border: 0; border-radius: 50%;
      background: transparent;
      color: var(--text3);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .row-action:active { background: var(--surface2); color: var(--accent); }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent-bg); color: var(--accent);
      font-size: 18px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .conv-info   { flex: 1; min-width: 0; }
    .conv-name   { font-size: 15px; font-weight: 500;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-meta   { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .pill {
      font-size: 11px; font-weight: 600; padding: 3px 8px;
      border-radius: 20px; flex-shrink: 0;
    }
    .pill-run  { background: var(--accent-bg); color: var(--accent); }
    .pill-fail { background: rgba(220,38,38,.18); color: #f87171; }

    /* ── Chat bubbles ───────────────────────────────────── */
    .chat-body-wrap {
      flex: 1; position: relative; min-height: 0; overflow: hidden;
    }
    .chat-body {
      height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      padding: 14px 14px 8px;
      display: flex; flex-direction: column; gap: 22px;
    }
    .mobile-scroll-to-bottom {
      position: absolute; bottom: 14px; right: 16px; z-index: 20;
      display: none; align-items: center; gap: 5px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 20px;
      padding: 8px 14px 8px 10px;
      font-size: 13px; font-family: inherit;
      cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.35);
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    /* 顶部弹性占位：消息少时把消息推到底部（类 iMessage 布局） */
    .chat-top-spacer {
      flex: 1 1 0;
      min-height: 0;
    }
    .empty-hint {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: var(--text3); font-size: 14px;
      padding-bottom: 60px;
    }
    .empty-hint .ei { font-size: 52px; opacity: .35; }

    .msg-pair { display: flex; flex-direction: column; gap: 6px; }

    /* User bubble — right */
    .msg-user { display: flex; justify-content: flex-end; }
    .user-msg-stack {
      max-width: 82%;
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 8px;
    }
    .user-bubble {
      background: var(--accent-dk); color: #fff;
      border-radius: 18px 18px 4px 18px;
      padding: 10px 14px;
      width: fit-content; max-width: 100%;
      font-size: 15px; line-height: 1.5;
      white-space: normal; word-break: normal;
    }
    .user-bubble-text {
      white-space: pre-wrap; word-break: break-word;
    }
    .user-image-attachments {
      display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
      max-width: 100%;
    }
    .user-image-attachment {
      width: 84px; height: 84px;
      border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border-md);
      background: var(--surface2);
      display: block; flex-shrink: 0;
    }
    .user-image-attachment img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .user-file-attachment {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      text-decoration: none; color: var(--text1);
      max-width: 220px; flex-shrink: 0;
    }
    .user-file-attachment .file-attach-name {
      font-size: 12px; color: var(--text1);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 160px;
    }
    .file-ext-badge {
      flex-shrink: 0; font-size: 9px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 2px 5px; border-radius: 4px;
      background: rgba(90,169,255,0.15); color: #5aa9ff;
      border: 1px solid rgba(90,169,255,0.3);
      font-family: ui-monospace, monospace; line-height: 1.3;
    }

    /* AI 渲染器容器 */
    .ai-log-wrap {
      min-width: 0;
      max-width: 100%;
      overflow-x: hidden;
      padding: 2px 0 4px;
    }
    .thinking-indicator {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0; color: var(--text3); font-size: 14px;
    }
    .tdots span {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent); margin: 0 1px;
      animation: tdot 1.1s infinite;
    }
    .tdots span:nth-child(2) { animation-delay: .18s; }
    .tdots span:nth-child(3) { animation-delay: .36s; }
    @keyframes tdot { 0%,80%,100%{transform:scale(.55);opacity:.4} 40%{transform:scale(1);opacity:1} }
    .ai-log-wrap .chat-log.timeline { max-width: 100%; }

    /* ── Input bar ──────────────────────────────────────── */
    .input-bar {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 10px calc(var(--sb) + 8px);
      display: flex; flex-direction: column; align-items: stretch; gap: 6px;
      width: 100%;
      max-width: 100%;
      transform: translateY(calc(-1 * var(--keyboard-offset)));
      transition: transform .16s ease;
      will-change: transform;
    }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
      width: 100%; min-width: 0;
    }
    .upload-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .upload-btn:active { border-color: var(--accent-dk); color: var(--accent); }
    .upload-btn svg { width: 19px; height: 19px; stroke-width: 2; }
    .input-bar textarea {
      flex: 1;
      min-width: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text); font-family: inherit;
      font-size: 16px; line-height: 1.4;
      padding: 9px 15px;
      resize: none; outline: none;
      max-height: 130px; overflow-y: auto; overflow-x: hidden;
    }
    .input-bar textarea:focus { border-color: var(--accent-dk); }
    .input-bar textarea::placeholder { color: var(--text3); }
    .compose-options {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
      padding: 0 2px;
      color: var(--text3);
      font-size: 12px;
    }
    .compose-option {
      display: inline-flex; align-items: center; gap: 5px;
      min-height: 28px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text2);
      -webkit-tap-highlight-color: transparent;
    }
    .compose-option input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: var(--accent-dk);
    }
    .compose-time {
      min-height: 28px;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text);
      font: 12px system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      padding: 3px 8px;
      outline: none;
    }
    .task-actions {
      display: flex; align-items: center; justify-content: flex-start;
      flex-wrap: wrap; gap: 8px;
      margin: -2px 0 6px;
      padding-left: 2px;
    }
    .task-action-btn {
      border: 1px solid var(--border-md);
      background: var(--surface2);
      color: var(--text2);
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .task-action-btn:active { border-color: var(--accent-dk); color: var(--accent); }
    .task-action-btn.danger {
      color: #fca5a5;
      border-color: rgba(248,113,113,.35);
      background: rgba(220,38,38,.12);
    }
    .task-state-note {
      color: var(--text3);
      font-size: 12px;
      line-height: 30px;
    }
    .btn-send {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent-dk); border: none; color: #fff;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-send:disabled { opacity: .35; }
    .btn-send:active:not(:disabled) { transform: scale(.9); }
    .btn-send svg { width: 18px; height: 18px; stroke-width: 2.2; }
    .image-preview-row {
      display: flex; flex-wrap: wrap; gap: 8px;
      max-height: 78px; overflow-y: auto; overflow-x: hidden;
      padding: 0 2px 2px 2px;
    }
    .chat-attach-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 28px 5px 6px;
      border-radius: 6px;
      border: 1px solid var(--border-md);
      background: var(--surface2);
      flex-shrink: 0;
      max-width: 220px;
    }
    .chat-attach-chip-thumb {
      width: 32px; height: 32px;
      object-fit: cover; border-radius: 4px; flex-shrink: 0;
    }
    .chat-attach-chip-name {
      font-size: 11px; color: var(--text1);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 140px;
    }
    .chat-attach-chip-remove {
      position: absolute; top: 50%; right: 4px;
      transform: translateY(-50%);
      width: 16px; height: 16px; border-radius: 50%;
      border: 0; padding: 0;
      background: rgba(0,0,0,.45); color: #fff;
      font-size: 11px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .chat-attach-chip-remove:hover { background: rgba(200,30,30,.85); }
    .upload-status {
      display: none;
      padding: 0 4px;
      color: var(--text3);
      font-size: 12px;
    }
    .terminal-body {
      flex: 1;
      display: flex; flex-direction: column;
      min-height: 0;
      padding: 10px;
      gap: 8px;
    }
    .mobile-terminal-mount {
      flex: 1;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #020617;
      overflow: hidden;
      padding: 6px;
    }
    .terminal-keys {
      display: flex; flex-wrap: wrap; gap: 7px;
      flex-shrink: 0;
    }
    .terminal-key {
      min-width: 44px;
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface2);
      color: var(--text2);
      font: 700 12px var(--mono);
    }
    .terminal-key.primary { color: var(--accent); border-color: rgba(45,212,191,.32); }

    /* ── Bottom sheet ───────────────────────────────────── */
    .backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 100;
      display: none; align-items: flex-end;
    }
    .backdrop.open { display: flex; }
    .sheet {
      background: var(--surface);
      border-radius: 18px 18px 0 0;
      width: 100%; max-height: 72dvh;
      display: flex; flex-direction: column;
      padding-bottom: var(--sb);
      animation: sheetUp .24s cubic-bezier(.4,0,.2,1);
    }
    @keyframes sheetUp { from{transform:translateY(100%)} to{transform:none} }
    .sheet-handle {
      width: 38px; height: 4px; border-radius: 2px;
      background: var(--border);
      margin: 10px auto 6px; flex-shrink: 0;
    }
    .sheet-ttl {
      font-size: 13px; font-weight: 600; color: var(--text3);
      text-align: center; padding: 0 16px 10px;
      flex-shrink: 0;
    }
    .sheet-search {
      padding: 8px 14px 10px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .sheet-search input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 16px;
      padding: 8px 12px; outline: none;
    }
    .sheet-search input:focus { border-color: var(--accent-dk); }
    .sheet-search input::placeholder { color: var(--text3); }
    .sheet-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .sheet-row {
      display: flex; align-items: center; gap: 12px;
      padding: 15px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .sheet-row:active { background: var(--surface2); }
    .sheet-actions {
      display: flex; flex-direction: column; gap: 8px;
      padding: 8px 16px calc(var(--sb) + 18px);
    }
    .sheet-action-btn {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text);
      font-size: 15px;
      font-weight: 650;
      text-align: center;
    }
    .sheet-action-btn.danger {
      color: #fca5a5;
      border-color: rgba(248,113,113,.3);
      background: rgba(220,38,38,.12);
    }
    .sheet-icon {
      width: 38px; height: 38px; border-radius: 9px;
      background: var(--accent-bg); color: var(--accent);
      font-size: 17px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;

    .sheet-sub  { font-size: 12px; color: var(--text3); margin-top: 2px; }
    #notif-btn.subscribed svg { stroke: var(--accent); fill: rgba(45,212,191,.15); }

    /* ── Project pin & dots ─────────────────────────────── */
    .proj-dots-btn {
      background: none; border: none; color: var(--text3);
      font-size: 16px; font-weight: 700; letter-spacing: .08em;
      padding: 4px 6px; border-radius: 6px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0; line-height: 1;
    }
    .proj-dots-btn:active { background: var(--surface); color: var(--accent); }
    .proj-label.pinned {
      border-left: 3px solid var(--amber);
      padding-left: 11px;
    }
    .proj-pin-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--amber);
      flex-shrink: 0;
    }

    /* ── Sort button ────────────────────────────────────── */
    .mobile-sort-btn {
      display: flex; align-items: center; gap: 4px;
      background: none; border: 1px solid var(--border);
      color: var(--text2);
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-sort-btn:active { border-color: var(--accent-dk); color: var(--accent); }
    .mobile-sort-btn svg { width: 13px; height: 13px; stroke-width: 2; }
    .mobile-sort-btn.active { border-color: rgba(45,212,191,.45); color: var(--accent); }
    .mobile-search {
      padding: 0 12px 10px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .mobile-search input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
      outline: none;
    }
    .mobile-search input:focus { border-color: var(--accent-dk); }
    .mobile-search-summary {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 8px 14px;
      color: var(--text3); font-size: 12px;
      border-bottom: 1px solid var(--border);
    }
    .mobile-search-summary button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      border-radius: 999px;
      padding: 5px 10px;
      font: inherit;
    }
    .mobile-search-type {
      flex-shrink: 0;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--text3);
      font-size: 11px;
      font-weight: 700;
    }
    .mobile-search-state {
      padding: 28px 16px;
      color: var(--text3);
      text-align: center;
      font-size: 14px;
    }
    .mobile-search-match {
      margin-top: 3px;
      color: var(--text3);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<!-- ── 会话列表 ──────────────────────────────────────── -->

    <div style="flex:1;min-width:0;padding-left:8px">

<!-- 依赖脚本必须在主逻辑 script 之前加载（移动端 giant inline script 在此之后），否则 renderPendingPreviews 等共享函数未定义会导致发送/上传时崩溃 -->
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/js/utils.js?v=20260601-download-auth"></script>
<script src="/static/js/shared/project-utils.js?v=20260527-shared"></script>
<script src="/static/js/shared/image-upload.js?v=20260528-imagefix"></script>
<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/addon-fit.js"></script>
<script src="/static/js/renderer.js?v=20260601-download-auth"></script>

<script>
// ── State ────────────────────────────────────────────────
let projects  = [];
let convs     = [];
let tasks     = [];
let activeConv    = null;   // Conversation object (ongoing chat)
let pendingProj   = null;   // Project selected for new chat (before first send)
let liveStream    = null;   // Active EventSource
let mobileUserScrolledUp = false;
const PROJECT_VISIBLE_LIMIT = 5;
const expandedProjects = new Set();
const collapsedProjects = new Set();
let stableAppHeight = 0;
let mobileSortOrder = localStorage.getItem('coderfleet.mobileSortOrder') || 'default';
const MOBILE_SORT_CYCLE  = ['default', 'activity', 'name', 'running'];
const MOBILE_SORT_LABELS = { default: '默认', activity: '活跃', name: '名称', running: '运行中' };
let mobileSearchQuery = '';
let mobileSearchTimer = null;
let mobileSearchResults = [];
let mobileSearchLoading = false;
let mobileSearchDeep = false;
let pendingImages = [];
let uploadingImages = 0;
let actionTarget = null;
let projActionTarget = null;   // 当前打开操作表的项目名
const mobilePinnedProjects = (function() {
  try {
    const saved = JSON.parse(localStorage.getItem('coderfleet.chatPinnedProjects') || '[]');
    return new Set(Array.isArray(saved) ? saved : []);
  } catch { return new Set(); }
})();
let mobileTerminal = {
  projectName: '',
  socket: null,
  terminal: null,
  fitAddon: null,
  connected: false,
};

function setViewportVars() {
  const vv = window.visualViewport;
  const layoutHeight = Math.round(Math.max(
    document.documentElement.clientHeight || 0,
    window.innerHeight || 0,
    vv ? vv.height + vv.offsetTop : 0,
  ));
  const visibleHeight = Math.round(vv?.height || window.innerHeight || layoutHeight);
  const viewportTop = Math.round(vv?.offsetTop || 0);
  const keyboardOffset = vv
    ? Math.max(0, layoutHeight - visibleHeight - viewportTop)
    : 0;
  const keyboardOpen = keyboardOffset > 80;

  if (!stableAppHeight || !keyboardOpen) {
    stableAppHeight = layoutHeight;
  }

  document.documentElement.style.setProperty('--app-height', `${stableAppHeight}px`);
  document.documentElement.style.setProperty('--keyboard-offset', `${keyboardOpen ? keyboardOffset : 0}px`);

  if (keyboardOpen) {
    window.scrollTo(0, 0);
  }
}

setViewportVars();
window.addEventListener('resize', setViewportVars);
window.addEventListener('resize', fitMobileTerminal);
window.addEventListener('beforeunload', () => disconnectMobileTerminal(false));
window.addEventListener('orientationchange', () => {
  stableAppHeight = 0;
  setTimeout(setViewportVars, 80);
  setTimeout(fitMobileTerminal, 160);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', setViewportVars);
  window.visualViewport.addEventListener('scroll', setViewportVars);
}

// ── 主题切换 ──────────────────────────────────────────────
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('cf-theme', next);
  updateMobileThemeIcon();
}

function updateMobileThemeIcon() {
  const btn = document.getElementById('mobile-theme-btn');
  if (!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.title = isDark ? '切换到浅色模式' : '切换到深色模式';
  btn.setAttribute('aria-label', btn.title);
  btn.innerHTML = isDark
    ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`
    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
}

if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('cf-theme')) {
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      updateMobileThemeIcon();
    }
  });
}

// ── Bootstrap（由 utils.js 加载后触发，见页尾 script）────
async function initApp() {
  updateMobileThemeIcon();
  _updateMobileSortLabel();
  await refresh();
  initPush();
  setInterval(checkHealth, 12000);
  setInterval(bgRefresh, 7000);
  const textarea = document.getElementById('ta');
  textarea.addEventListener('input', () => {
    updateSendState();
  });
  textarea.addEventListener('paste', handlePaste);
  textarea.addEventListener('focus', () => setTimeout(setViewportVars, 60));
  textarea.addEventListener('blur', () => setTimeout(setViewportVars, 120));
}

async function refresh() {
  await checkHealth();
  try {
    [projects, convs, tasks] = await Promise.all([
      api('/api/projects'),
      api('/api/conversations'),
      api('/api/tasks?limit=600'),
    ]);
    renderList();
  } catch {}
}

async function bgRefresh() {
  try {
    [convs, tasks] = await Promise.all([
      api('/api/conversations'),
      api('/api/tasks?limit=600'),
    ]);
    renderList();
    if (activeConv && !isListVisible()) syncMessages(false);
  } catch {}
}

async function checkHealth() {
  try {
    await api('/api/health');
    setLbl('已连接', true);
  } catch {
    setLbl('未连接', false);
  }
}

function setLbl(t, ok) {
  const el = document.getElementById('health-lbl');
  el.textContent = t;
  el.style.color = ok ? 'var(--accent)' : 'var(--red)';
}

// ── Conversation list ─────────────────────────────────────
function renderList() {
  const el = document.getElementById('conv-list');
  const activeQuery = mobileSearchQuery.trim();
  if (activeQuery) {
    renderMobileSearchResults(mobileSearchResults, activeQuery, mobileSearchDeep);
    return;
  }
  if (!projects.length) {
    el.innerHTML = '<div class="empty-hint"><div class="ei">💬</div><div>暂无项目配置</div></div>';
    return;
  }

  const belongsToConv  = window.conversationBelongsToProject || conversationBelongsToProject;
  const belongsToTask  = window.taskBelongsToProject || taskBelongsToProject;
  const sortedProjects = [...projects];
  if (mobileSortOrder === 'name') {
    sortedProjects.sort((a, b) => a.name.localeCompare(b.name));
  } else if (mobileSortOrder === 'activity') {
    const latestTime = proj => {
      const times = [
        ...convs.filter(c => belongsToConv(c, proj)).map(c => new Date(c.updated || c.created || 0).getTime()),
        ...tasks.filter(t => belongsToTask(t, proj)).map(t => new Date(t.created || 0).getTime()),
      ];
      return times.length ? Math.max(...times) : 0;
    };
    sortedProjects.sort((a, b) => latestTime(b) - latestTime(a));
  } else if (mobileSortOrder === 'running') {
    const runCount = proj => tasks.filter(t => belongsToTask(t, proj) && t.status === 'running').length;
    sortedProjects.sort((a, b) => runCount(b) - runCount(a));
  }
  // Pinned projects always float to top (stable secondary sort)
  sortedProjects.sort((a, b) => (mobilePinnedProjects.has(b.name) ? 1 : 0) - (mobilePinnedProjects.has(a.name) ? 1 : 0));

  el.innerHTML = sortedProjects.map(proj => {
    const isPinned = mobilePinnedProjects.has(proj.name);
    const list = projectDevItems(proj);
    const isCollapsed = collapsedProjects.has(proj.name);
    const isExpanded = expandedProjects.has(proj.name);
    const visible = isExpanded ? list : list.slice(0, PROJECT_VISIBLE_LIMIT);
    const hiddenCount = Math.max(0, list.length - visible.length);
    const encodedName = encodeURIComponent(proj.name).replace(/'/g, '%27');
    const projJson = JSON.stringify(proj).replace(/"/g,'&quot;');
    const body = isCollapsed
      ? ''
      : list.length
        ? `${visible.map(item => devItemRow(item)).join('')}${hiddenCount ? `
      <button class="proj-more" onclick="event.stopPropagation();toggleProjectItems('${encodedName}')">
        ${isExpanded ? '收起' : `展开显示 ${hiddenCount} 个`}
      </button>` : ''}`
        : '<div class="proj-empty">暂无对话</div>';
    return `
      <div class="proj-label${isPinned ? ' pinned' : ''}" onclick="toggleProjectGroup('${encodedName}')">
        <div class="proj-title">
          <span class="proj-toggle">${isCollapsed ? '+' : '-'}</span>
          ${isPinned ? '<span class="proj-pin-dot"></span>' : ''}
          <span>${x(proj.name)}</span>
        </div>
        <button class="proj-dots-btn" title="项目操作"
          onclick="event.stopPropagation();showProjActions('${encodedName}')">···</button>
        <button class="proj-term-btn" title="打开终端"
          onclick="event.stopPropagation();openMobileTerminal('${encodedName}')">&gt;_</button>
        <button class="proj-new-btn" title="新建对话"
          onclick="event.stopPropagation();startNew(${projJson})">+</button>
      </div>
      ${body}
    `;
	  }).join('');
	}

function mobileSearchTypeLabel(type) {
  return {
    project: '项目',
    conversation: '对话',
    task: '任务',
    content: '内容',
  }[type] || type;
}

function mobileSearchTargetId(result) {
  if (result.type === 'project') return result.project_name || result.id;
  if (result.type === 'conversation') return result.conversation_id || result.id;
  if (result.type === 'task' || result.type === 'content') {
    return result.conversation_id || (result.task_id ? `task-${result.task_id}` : result.id);
  }
  return result.id;
}

function renderMobileSearchResults(results, query, deep = false, error = '') {
  const el = document.getElementById('conv-list');
  const q = String(query || '').trim();
  if (!q) {
    renderList();
    return;
  }

  if (mobileSearchLoading) {
    el.innerHTML = '<div class="mobile-search-state">搜索中...</div>';
    return;
  }
  if (error) {
    el.innerHTML = `<div class="mobile-search-state">搜索失败：${x(error)}</div>`;
    return;
  }

  const header = `<div class="mobile-search-summary">
    <span>${results.length ? `${results.length} 个结果` : '无匹配结果'}</span>
    ${deep ? '<span>已搜索内容</span>' : '<button onclick="runMobileDeepSearch()">搜索内容</button>'}
  </div>`;
  if (!results.length) {
    el.innerHTML = `${header}<div class="mobile-search-state">没有找到「${x(q)}」</div>`;
    return;
  }

  el.innerHTML = header + results.map(result => {
    const target = encodeURIComponent(mobileSearchTargetId(result));
    const projectName = encodeURIComponent(result.project_name || '');
    const match = (result.matches || [])[0];
    const snippet = match ? `<div class="mobile-search-match">${x(match.field)}：${x(match.snippet)}</div>` : '';
    return `<div class="conv-row" onclick="openMobileSearchResult('${x(result.type)}','${target}','${projectName}')">
      <span class="mobile-search-type">${x(mobileSearchTypeLabel(result.type))}</span>
      <div class="conv-info">
        <div class="conv-name">${x(result.title || result.id)}</div>
        <div class="conv-meta">${x(result.subtitle || '')}</div>
        ${snippet}
      </div>
    </div>`;
  }).join('');
}

async function performMobileSearch(query, deep = false) {
  const q = String(query || '').trim();
  if (!q) return;
  mobileSearchLoading = true;
  mobileSearchDeep = deep;
  renderMobileSearchResults(mobileSearchResults, q, deep);
  try {
    const params = new URLSearchParams({ q, scope: 'all', limit: '80' });
    if (deep) params.set('deep', 'true');
    const data = await api(`/api/search?${params.toString()}`);
    if (q !== mobileSearchQuery.trim()) return;
    mobileSearchResults = data.results || [];
    mobileSearchLoading = false;
    renderMobileSearchResults(mobileSearchResults, q, deep);
  } catch (err) {
    if (q !== mobileSearchQuery.trim()) return;
    mobileSearchLoading = false;
    renderMobileSearchResults([], q, deep, err.message || String(err));
  }
}

function runMobileDeepSearch() {
  const q = mobileSearchQuery.trim();
  if (q) performMobileSearch(q, true);
}

function clearMobileSearch() {
  mobileSearchQuery = '';
  mobileSearchResults = [];
  mobileSearchLoading = false;
  mobileSearchDeep = false;
  const input = document.getElementById('mobile-search-input');
  if (input) input.value = '';
}

function handleMobileSearch(value) {
  mobileSearchQuery = value;
  mobileSearchResults = [];
  mobileSearchDeep = false;
  clearTimeout(mobileSearchTimer);
  const q = mobileSearchQuery.trim();
  if (!q) {
    mobileSearchLoading = false;
    renderList();
    return;
  }
  mobileSearchLoading = true;
  renderMobileSearchResults([], q);
  mobileSearchTimer = setTimeout(() => performMobileSearch(q), 220);
}

function openMobileSearchResult(type, encodedTarget, encodedProjectName) {
  const target = decodeURIComponent(encodedTarget || '');
  const projectName = decodeURIComponent(encodedProjectName || '');
  clearMobileSearch();
  if (type === 'project') {
    if (projectName) collapsedProjects.delete(projectName);
    renderList();
    return;
  }
  if (target.startsWith('task-')) openOneOff(target.slice(5));
  else if (target) openConv(target);
}

	function projectDevItems(proj) {
  const convItems = convs
    .filter(c => (window.conversationBelongsToProject || conversationBelongsToProject)(c, proj))
    .map(c => ({
      type: 'conversation',
      id: c.id,
      time: convTimeValue(c),
      data: c,
    }));
  const oneOffItems = tasks
    .filter(t => !t.conversation_id && (window.taskBelongsToProject || taskBelongsToProject)(t, proj))
    .map(t => ({
      type: 'one-off',
      id: `task-${t.id}`,
      time: new Date(t.created || 0).getTime() || 0,
      data: t,
    }));
  return [...convItems, ...oneOffItems].sort((a, b) => b.time - a.time);
}

function devItemRow(item) {
  return item.type === 'one-off' ? oneOffRow(item.data) : convRow(item.data);
}

function convRow(c) {
  const ct = tasks
    .filter(t => t.conversation_id === c.id || (c.last_task_id && t.id === c.last_task_id))
    .sort((a, b) => new Date(b.created || 0) - new Date(a.created || 0));
  const latest = ct[0];
  const st = latest?.status ?? 'done';
  const isRun  = ['running','pending','scheduled'].includes(st);
  const isFail = ['failed','killed'].includes(st);
  const badge  = isRun  ? `<span class="pill pill-run">运行中</span>`
               : isFail ? `<span class="pill pill-fail">失败</span>`
               : '';
  return `<div class="conv-row" onclick="openConv('${c.id}')">
    <div class="avatar">${x(c.name[0]?.toUpperCase() ?? '?')}</div>
    <div class="conv-info">
      <div class="conv-name">${x(c.name)}</div>
      <div class="conv-meta">${x(relTime(c.updated))}${ct.length ? ` · ${ct.length} 条` : ''}</div>
    </div>
    ${badge}
    <button class="row-action" title="更多操作" onclick="event.stopPropagation();showItemActions('conversation','${x(c.id)}')">...</button>
  </div>`;
}

function oneOffRow(task) {
  const st = task.status ?? 'done';
  const isRun  = ['running','pending','scheduled'].includes(st);
  const isFail = ['failed','killed'].includes(st);
  const badge  = isRun  ? `<span class="pill pill-run">${x(mobileTaskStatusLabel(st))}</span>`
               : isFail ? `<span class="pill pill-fail">${x(mobileTaskStatusLabel(st))}</span>`
               : '';
  return `<div class="conv-row" onclick="openOneOff('${task.id}')">
    <div class="avatar">${x((task.prompt || '?')[0]?.toUpperCase() ?? '?')}</div>
    <div class="conv-info">
      <div class="conv-name">${x(task.prompt || task.id)}</div>
      <div class="conv-meta">${x(relTime(task.created))} · 一次性任务</div>
    </div>
    ${badge}
    <button class="row-action" title="更多操作" onclick="event.stopPropagation();showItemActions('one-off','${x(task.id)}')">...</button>
  </div>`;
}

// ── Open conversation ─────────────────────────────────────
function openConv(id) {
  activeConv  = convs.find(c => c.id === id) || null;
  pendingProj = null;
  if (!activeConv) return;

  document.getElementById('chat-ttl').textContent = activeConv.name;
  document.getElementById('chat-sub').textContent = activeConv.project_name || activeConv.project || '';
  showChat();
  syncMessages(true);
}

function openOneOff(id) {
  const task = tasks.find(t => t.id === id) || null;
  if (!task) return;
  activeConv = {
    id: `task-${task.id}`,
    name: task.prompt,
    project: task.project,
    project_name: task.project_name,
    account: task.account,
    isOneOff: true,
  };
  pendingProj = null;

  document.getElementById('chat-ttl').textContent = task.prompt;
  document.getElementById('chat-sub').textContent = task.project_name || task.project || '一次性任务';

  syncMessages(true);

// ── Bubble rendering ──────────────────────────────────────
function syncMessages(scrollEnd) {
  const body   = document.getElementById('chat-body');
  const empty  = document.getElementById('chat-empty');
  const spacer = document.getElementById('chat-top-spacer');
  const ct    = tasks
    .filter(t => activeConv?.isOneOff
      ? `task-${t.id}` === activeConv.id
      : t.conversation_id === activeConv?.id || (activeConv?.last_task_id && t.id === activeConv.last_task_id))
    .sort((a, b) => new Date(a.created || 0) - new Date(b.created || 0));

  if (!ct.length) {
    body.querySelectorAll('.msg-pair').forEach(el => el.remove());
    empty.style.display = 'flex';
    if (spacer) spacer.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  if (spacer) spacer.style.display = '';

  ct.forEach(task => {
    const existing = document.getElementById(`mp-${task.id}`);
    if (!existing) {
      body.appendChild(makeMsgPair(task));
      loadAiContent(task);
    } else if (existing.dataset.status !== (task.status || '')) {
      const replacement = makeMsgPair(task);
      existing.replaceWith(replacement);
      loadAiContent(task);
    }
  });

  body.querySelectorAll('.msg-pair').forEach(el => {
    if (!ct.find(t => `mp-${t.id}` === el.id)) el.remove();
  });

  if (scrollEnd) {
    mobileUserScrolledUp = false;
    _mobileUpdateScrollBtn(false);
    body.scrollTop = body.scrollHeight;
  }
}

function makeMsgPair(task) {
  const div = document.createElement('div');
  div.className = 'msg-pair';
  div.id = `mp-${task.id}`;
  div.dataset.status = task.status || '';
  div.innerHTML = `
    <div class="msg-user">
      <div class="user-msg-stack">
        <div class="user-bubble">
          <div class="user-bubble-text">${x(task.prompt)}</div>
        </div>
        ${renderTaskImages(task)}
      </div>
    </div>
    <div class="ai-log-wrap" id="ab-${task.id}">
      <div class="thinking-indicator">
        <div class="tdots"><span></span><span></span><span></span></div>
        <span>正在执行…</span>
      </div>
    </div>
    ${taskActionsHtml(task)}
  `;
  return div;
}

async function loadAiContent(task) {
  const wrap = document.getElementById(`ab-${task.id}`);
  if (!wrap) return;

  if (task.status === 'running') {
    streamAiContent(task, wrap);
    return;
  }
  if (task.status === 'pending') {
    const renderer = new ChatLogRenderer(wrap, false, true, task.project_name || null, task.id);
    renderer.renderPending();
    return;
  }
  if (task.status === 'scheduled') {
    const renderer = new ChatLogRenderer(wrap, false, true, task.project_name || null, task.id);
    renderer.renderScheduled(task.execute_at);
    return;
  }

  try {
    const txt = await fetch(`/api/tasks/${task.id}/logs`).then(r => r.text());
    const renderer = new ChatLogRenderer(wrap, false, true, task.project_name || null, task.id);
    renderer.render(stripAnsi(txt), task.type);
  } catch { wrap.textContent = '加载失败'; }
}

function _mobileUpdateScrollBtn(show) {
  const btn = document.getElementById('mobile-scroll-to-bottom');
  if (btn) btn.style.display = show ? 'flex' : 'none';
}

function mobileScrollToBottom() {
  mobileUserScrolledUp = false;
  _mobileUpdateScrollBtn(false);
  const body = document.getElementById('chat-body');
  if (body) body.scrollTop = body.scrollHeight;
}

function bindMobileChatScroll() {
  mobileUserScrolledUp = false;
  _mobileUpdateScrollBtn(false);
  const body = document.getElementById('chat-body');
  if (!body) return;
  body.onscroll = function () {
    const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 80;
    mobileUserScrolledUp = !atBottom;
    _mobileUpdateScrollBtn(mobileUserScrolledUp);
  };
}

async function streamAiContent(task, wrap) {
  const id = task.id;
  if (liveStream) { liveStream.close(); liveStream = null; }
  const renderer = new ChatLogRenderer(wrap, true, true, task.project_name || null, task.id);
  let skipBytes = 0;
  try {
    const txt = await fetch(`/api/tasks/${id}/logs`).then(r => r.ok ? r.text() : '');
    skipBytes = new TextEncoder().encode(txt).byteLength;
    if (txt.trim()) {
      renderer.render(stripAnsi(txt), task.type);
    } else {
      renderer.renderPending();
    }
  } catch {
    renderer.renderPending();
  }
  const body = document.getElementById('chat-body');
  const qs = skipBytes > 0 ? `skip_bytes=${skipBytes}` : 'tail=0';
  const es = new EventSource(sseUrl(`/api/tasks/${id}/logs/stream?${qs}`));
  es.taskId = id;
  liveStream = es;
  es.onmessage = e => {
    if (e.data === '[DONE]') { renderer.deactivatePendingInterventions(); es.close(); liveStream = null; bgRefresh(); return; }
    renderer.push(stripAnsi(e.data));
    if (!mobileUserScrolledUp) body.scrollTop = body.scrollHeight;
  };
  es.onerror = () => {
    es.close(); liveStream = null;
    bgRefresh();
  };
}

// ── Send ─────────────────────────────────────────────────
async function send() {
  const ta   = document.getElementById('ta');
  let prompt = ta.value.trim();
  if (!prompt && pendingImages.length === 0) return;
  if (!prompt && pendingImages.length > 0) prompt = '请查看附件图片。';
  if (uploadingImages > 0) {
    alert('图片还在上传中，请稍后再发送');
    return;
  }

  const btn = document.getElementById('btn-send');
  btn.disabled = true;
  ta.value = '';
  ta.style.height = '';
  const autoMode = document.getElementById('auto-mode')?.checked ?? true;
  const executeAt = currentScheduleTime();

  try {
    let body;
    if (activeConv) {
      let conversationId = activeConv.id;
      if (activeConv.isOneOff) {
        conversationId = await upgradeOneOffToConversation(activeConv);
      }
      body = {
        prompt,
        project:      activeConv.project,
        project_name: activeConv.project_name,
        account:      activeConv.account,
        conversation_id: conversationId,
        auto: autoMode,
        images: pendingImages.map(i => i.container_path),
        execute_at: executeAt,
      };
    } else if (pendingProj) {
      const name = prompt.slice(0, 28) + (prompt.length > 28 ? '…' : '');
      body = {
        prompt,
        project:           pendingProj.path,
        project_name:      pendingProj.name,
        account:           pendingProj.account,
        conversation_name: name,
        auto: autoMode,
        images: pendingImages.map(i => i.container_path),
        execute_at: executeAt,
      };
    } else { return; }

    const task = await api('/api/tasks', { method:'POST', body });
    tasks.unshift(task);
    pendingImages = [];
    if (typeof renderImagePreviews === 'function') {
      renderImagePreviews();
    } else {
      const c = document.getElementById('image-previews');
      if (c) { c.style.display = 'none'; c.innerHTML = ''; }
    }
    resetScheduleControls();

    // If new chat, attach to the created conversation
    if (!activeConv && task.conversation_id) {
      convs = await api('/api/conversations').catch(() => convs);
      activeConv = convs.find(c => c.id === task.conversation_id) || null;
      pendingProj = null;
      if (activeConv) {
        document.getElementById('chat-ttl').textContent = activeConv.name;
        document.getElementById('chat-sub').textContent = activeConv.project_name || '';
      }
    }
    syncMessages(true);
  } catch (err) {
    alert('发送失败：' + (err.message || err));
    updateSendState();
  }
}

async function upgradeOneOffToConversation(conv) {
  const taskId = String(conv.id || '').replace(/^task-/, '');
  const task = tasks.find(t => t.id === taskId);
  if (!task) throw new Error('未找到一次性任务，无法升级任务链');
  const res = await api('/api/conversations', {
    method: 'POST',
    body: {
      name: task.prompt.slice(0, 20) + (task.prompt.length > 20 ? '…' : ''),
      task_id: taskId,
    },
  });
  convs = await api('/api/conversations').catch(() => convs);
  activeConv = convs.find(c => c.id === res.id) || res;
  document.getElementById('chat-ttl').textContent = activeConv.name;
  document.getElementById('chat-sub').textContent = activeConv.project_name || activeConv.project || '';
  return res.id;
}

function currentScheduleTime() {
  const enabled = document.getElementById('schedule-mode')?.checked;
  const input = document.getElementById('schedule-time');
  if (!enabled || !input?.value) return null;
  return input.value.includes(':') && input.value.split(':').length === 2
    ? `${input.value}:00`
    : input.value;
}

function toggleScheduleInput(checked) {
  const input = document.getElementById('schedule-time');
  if (!input) return;
  input.style.display = checked ? '' : 'none';
  if (checked && !input.value) input.focus();
}

function resetScheduleControls() {
  const enabled = document.getElementById('schedule-mode');
  const input = document.getElementById('schedule-time');
  if (enabled) enabled.checked = false;
  if (input) {
    input.value = '';
    input.style.display = 'none';
  }
}

function taskActionsHtml(task) {
  const status = task.status || '';
  if (['running', 'pending', 'scheduled'].includes(status)) {
    const label = status === 'running' ? '终止执行' : status === 'pending' ? '取消排队' : '取消定时';
    return `<div class="task-actions">
      <button class="task-action-btn danger" onclick="event.stopPropagation();killMobileTask('${x(task.id)}')">${label}</button>
      <span class="task-state-note">${x(mobileTaskStatusLabel(status))}</span>
    </div>`;
  }
  if (['failed', 'killed'].includes(status)) {
    return `<div class="task-actions">
      <button class="task-action-btn" onclick="event.stopPropagation();retryMobileTask('${x(task.id)}')">重试</button>
      <span class="task-state-note">${x(mobileTaskStatusLabel(status))}</span>
    </div>`;
  }
  return '';
}

function mobileTaskStatusLabel(status) {
  return {
    running: '运行中',
    pending: '排队中',
    scheduled: '已定时',
    done: '完成',
    failed: '失败',
    killed: '已终止',
  }[status] || status;
}

async function killMobileTask(taskId) {
  if (!confirm('确认终止这个任务？')) return;
  try {
    const r = await fetch(`/api/tasks/${encodeURIComponent(taskId)}`, { method: 'DELETE' });
    if (!r.ok) throw new Error(await r.text());
    await bgRefresh();
    if (activeConv) syncMessages(false);
  } catch (err) {
    alert('终止失败：' + (err.message || err));
  }
}

async function retryMobileTask(taskId) {
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  try {
    const body = task.conversation_id ? {
      prompt: task.prompt,
      conversation_id: task.conversation_id,
      auto: task.auto,
      images: task.images || [],
    } : {
      prompt: task.prompt,
      project: task.project,
      project_name: task.project_name,
      account: task.account,
      auto: task.auto,
      images: task.images || [],
    };
    const next = await api('/api/tasks', { method: 'POST', body });
    tasks.unshift(next);
    await bgRefresh();
    if (activeConv) syncMessages(true);
  } catch (err) {
    alert('重试失败：' + (err.message || err));
  }
}

async function handleFileSelect(input) {
  const files = Array.from(input.files || []);
  input.value = '';
  if (files.length) await uploadImages(files);
}

async function handlePaste(event) {
  const files = Array.from(event.clipboardData?.items || [])
    .filter(item => item.kind === 'file' && item.type.startsWith('image/'))
    .map(item => item.getAsFile())
    .filter(Boolean);
  if (!files.length) return;
  event.preventDefault();
  await uploadImages(files, true);
}

async function uploadImages(files, fromPaste = false) {
  if (typeof uploadFilesForCompose === 'function') {
    // Phase 2: 复用共享的 uploadFilesForCompose（消除与 chat.js 的重复 wrapper）
    await uploadFilesForCompose(files, fromPaste, {
      getProjectName: () => currentUploadProjectName(),
      onItemUploaded: (item) => {
        if (!Array.isArray(pendingImages)) pendingImages = [];
        pendingImages.push(item);
        renderImagePreviews();
      },
      onProgressChange: (count) => {
        uploadingImages = count;
        updateUploadState();
      },
      onError: (msg) => alert('上传图片失败：' + msg),
      getApiBase: () => '',
    });
    return;
  }

  if (typeof uploadFilesGeneric !== 'function') {
    alert('文件上传组件未就绪，请刷新页面后重试');
    return;
  }

  const projectName = currentUploadProjectName();
  if (!projectName) {
    alert('请先选择项目后再上传图片');
    return;
  }

  await uploadFilesGeneric(projectName, files, fromPaste, {
    onFileUploaded: (item) => {
      if (!Array.isArray(pendingImages)) pendingImages = [];
      pendingImages.push(item);
      renderImagePreviews();
    },
    onProgressChange: (count) => {
      uploadingImages = count;
      updateUploadState();
    },
    onError: (msg) => alert('上传图片失败：' + msg),
    getApiBase: () => '',
  });
}

// normalizeFileForUpload / uploadFilesGeneric 由 shared/image-upload.js 提供

// Phase 2 去重：使用共享的 renderPendingPreviews（mobile 配置）
function renderImagePreviews() {
  if (typeof renderPendingPreviews === 'function') {
    renderPendingPreviews({
      containerId: 'image-previews',
      getImages: () => pendingImages,
      removeImage: (index) => pendingImages.splice(index, 1),
      clearImages: () => { pendingImages = []; },
      afterRender: () => updateSendState(),
      getSseUrl: (u) => (typeof x === 'function' && typeof sseUrl === 'function' ? x(sseUrl(u)) : u),
      getApi: () => '',
      escFn: (s) => (typeof x === 'function' ? x(s) : String(s || '')),
    });
  } else {
    // 防御：共享脚本尚未加载或加载失败时避免崩溃（此时预览区简单隐藏即可）
    const container = document.getElementById('image-previews');
    if (container) {
      container.style.display = 'none';
      container.innerHTML = '';
    }
    updateSendState();
  }
}

// removePendingImage / clearPendingImages 由 shared 提供（全局）
// 它们会自动回退调用 renderImagePreviews

function updateUploadState() {
  const status = document.getElementById('upload-status');
  if (status) {
    status.style.display = uploadingImages > 0 ? 'block' : 'none';
    status.textContent = uploadingImages > 0 ? `正在上传 ${uploadingImages} 张图片…` : '';
  }
  updateSendState();
}

function updateSendState() {
  const ta = document.getElementById('ta');
  const btn = document.getElementById('btn-send');
  if (!btn || !ta) return;
  btn.disabled = uploadingImages > 0 || (ta.value.trim() === '' && pendingImages.length === 0);
}

function currentUploadProjectName() {
  if (activeConv?.project_name) return activeConv.project_name;
  if (activeConv?.project) {
    const fn = window.projectPathContains || projectPathContains;
    const proj = projects.find(p => fn && fn(p.path, activeConv.project));
    if (proj) return proj.name;
  }
  return pendingProj?.name || '';
}

function renderTaskImages(task) {

// ── New chat (via proj header button) ────────────────────

function renderProjSheet(query) {
  const q = query.toLowerCase().trim();
  const filtered = q
    ? projects.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.account.toLowerCase().includes(q))
    : projects;

  const list = document.getElementById('proj-list');
  if (!filtered.length) {
    list.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text3);font-size:14px">无匹配项目</div>`;
    return;
  }
  list.innerHTML = filtered.map(p => `
    <div class="sheet-row" onclick="startNew(${JSON.stringify(p).replace(/"/g,'&quot;')})">
      <div class="sheet-icon">${x(p.name[0]?.toUpperCase() ?? '?')}</div>
      <div>
        <div class="sheet-name">${x(p.name)}</div>
        <div class="sheet-sub">${x(p.account)}</div>
      </div>
    </div>
  `).join('');
}

function startNew(proj) {
  closeSheet();
  pendingProj = proj;
  activeConv  = null;

  document.getElementById('chat-ttl').textContent = '新对话';
  document.getElementById('chat-sub').textContent = proj.name;
  document.getElementById('chat-body').querySelectorAll('.msg-pair').forEach(el => el.remove());
  document.getElementById('chat-empty').style.display = 'flex';
  const spacer = document.getElementById('chat-top-spacer');
  if (spacer) spacer.style.display = 'none';
  showChat();
  document.getElementById('ta').focus();
}

function closeSheet() {
  document.getElementById('proj-sheet').classList.remove('open');
}

function showItemActions(type, id) {
  actionTarget = { type, id };
  const title = document.getElementById('action-sheet-title');
  if (title) title.textContent = type === 'one-off' ? '一次性任务操作' : '对话操作';
  document.getElementById('action-sheet').classList.add('open');
}

function closeActionSheet() {
  document.getElementById('action-sheet').classList.remove('open');
  actionTarget = null;
}

async function archiveActionTarget() {
  if (!actionTarget) return;
  const { type, id } = actionTarget;
  try {
    if (type === 'conversation') {
      await api(`/api/conversations/${encodeURIComponent(id)}`, {
        method: 'PATCH',
        body: { status: 'archived' },
      });
      if (activeConv?.id === id) backToList();
    } else {
      await api(`/api/tasks/${encodeURIComponent(id)}`, {
        method: 'PATCH',
        body: { archived: true },
      });
      if (activeConv?.id === `task-${id}`) backToList();
    }
    closeActionSheet();
    await refresh();
  } catch (err) {
    alert('归档失败：' + (err.message || err));
  }
}

async function deleteActionTarget() {
  if (!actionTarget) return;
  const { type, id } = actionTarget;
  const msg = type === 'one-off'
    ? '确认永久删除这个一次性任务？日志也会被删除。'
    : '确认永久删除这个对话？任务记录会保留。';
  if (!confirm(msg)) return;
  try {
    const url = type === 'one-off'
      ? `/api/tasks/${encodeURIComponent(id)}/record`
      : `/api/conversations/${encodeURIComponent(id)}`;
    const r = await fetch(url, { method: 'DELETE' });
    if (!r.ok && r.status !== 204) throw new Error(await r.text());
    if ((type === 'conversation' && activeConv?.id === id) || (type === 'one-off' && activeConv?.id === `task-${id}`)) {
      backToList();
    }
    closeActionSheet();
    await refresh();
  } catch (err) {
    alert('删除失败：' + (err.message || err));
  }
}

function openMobileTerminal(encodedProjectName) {
  const projectName = decodeURIComponent(encodedProjectName);
  mobileTerminal.projectName = projectName;
  document.getElementById('term-ttl').textContent = `终端 · ${projectName}`;
  document.getElementById('term-sub').textContent = '连接中...';
  document.getElementById('v-terminal').classList.remove('slide-out');
  connectMobileTerminal();
}

function backFromTerminal() {
  document.getElementById('v-terminal').classList.add('slide-out');
  disconnectMobileTerminal();
}

function ensureMobileTerminal() {
  const mount = document.getElementById('mobile-terminal');
  if (!mount || !window.Terminal || !window.FitAddon) return false;
  if (mobileTerminal.terminal && mount.childElementCount) return true;
  mount.innerHTML = '';
  mobileTerminal.fitAddon = new window.FitAddon.FitAddon();
  mobileTerminal.terminal = new window.Terminal({
    cursorBlink: true,
    fontSize: 12,
    fontFamily: 'SF Mono, Menlo, monospace',
    theme: { background: '#020617', foreground: '#e5edf2', cursor: '#2dd4bf' },
    scrollback: 1500,
  });
  mobileTerminal.terminal.loadAddon(mobileTerminal.fitAddon);
  mobileTerminal.terminal.open(mount);
  mobileTerminal.terminal.onData(data => sendTerminalKey(data));

  // 触摸滚动：拦截 xterm.js 将触摸事件转成转义码（会被 bash 解读为方向键/命令历史）
  // 改为直接调用 scrollLines 滚动视口内容
  const _termEl = mobileTerminal.terminal.element;
  if (_termEl) {
    let _touchLastY = 0;
    _termEl.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      _touchLastY = e.touches[0].clientY;
    }, { passive: true, capture: true });
    _termEl.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;
      e.preventDefault();
      e.stopPropagation();
      const currentY = e.touches[0].clientY;
      const deltaY = _touchLastY - currentY;
      _touchLastY = currentY;
      if (Math.abs(deltaY) >= 2) {
        const lines = Math.round(Math.abs(deltaY) / 18) || 1;
        mobileTerminal.terminal.scrollLines(deltaY > 0 ? lines : -lines);
      }
    }, { passive: false, capture: true });
    _termEl.addEventListener('touchend', () => { _touchLastY = 0; }, { passive: true, capture: true });
  }

  setTimeout(fitMobileTerminal, 60);
  return true;
}

function terminalSocketUrl(projectName) {
  return wsUrl(`/api/projects/${encodeURIComponent(projectName)}/terminal`);
}

function connectMobileTerminal() {
  const projectName = mobileTerminal.projectName;
  if (!projectName || !ensureMobileTerminal()) return;
  disconnectMobileTerminal(false);
  const term = mobileTerminal.terminal;
  term.clear();
  term.writeln(`Connecting to ${projectName}...`);
  const socket = new WebSocket(terminalSocketUrl(projectName));
  mobileTerminal.socket = socket;
  socket.onopen = () => {
    mobileTerminal.connected = true;
    document.getElementById('term-sub').textContent = '已连接';
    fitMobileTerminal();
  };
  socket.onmessage = event => {
    let message;
    try { message = JSON.parse(event.data); } catch { return; }
    if (message.type === 'output') term.write(String(message.data || ''));
    if (message.type === 'status') {
      document.getElementById('term-sub').textContent = message.message || message.state || '';
      if (message.state === 'error') term.writeln(`\r\n${message.message || '连接失败'}`);
    }
  };
  socket.onclose = () => {
    mobileTerminal.connected = false;
    document.getElementById('term-sub').textContent = '已断开';
  };
  socket.onerror = () => {
    mobileTerminal.connected = false;
    document.getElementById('term-sub').textContent = '连接失败';
  };
}

function sendTerminalKey(data) {
  const socket = mobileTerminal.socket;
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({ type: 'input', data }));
}

function fitMobileTerminal() {
  if (!mobileTerminal.terminal || !mobileTerminal.fitAddon) return;
  try {
    mobileTerminal.fitAddon.fit();
    const socket = mobileTerminal.socket;
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({
        type: 'resize',
        cols: mobileTerminal.terminal.cols,
        rows: mobileTerminal.terminal.rows,
      }));
    }
  } catch {}
}

function disconnectMobileTerminal(dispose = true) {
  const socket = mobileTerminal.socket;
  mobileTerminal.socket = null;
  mobileTerminal.connected = false;
  if (socket && socket.readyState <= WebSocket.OPEN) socket.close();
  if (dispose && mobileTerminal.terminal) {
    mobileTerminal.terminal.dispose();
    mobileTerminal.terminal = null;
    mobileTerminal.fitAddon = null;
    document.getElementById('mobile-terminal').innerHTML = '';
  }
}

function isListVisible() {
  return document.getElementById('v-chat').classList.contains('slide-out');
}

// ── Input helpers ─────────────────────────────────────────
function onInput(ta) {
  ta.style.height = 'auto';

function onKey(e) {
  // Desktop: Enter to send, Shift+Enter for newline
  if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) {
    e.preventDefault();
    send();
  }
}

// ── Utils ─────────────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

// ── Web Push ──────────────────────────────────────────────

let _vapidPublicKey = null;
let _pushSubscription = null;

function setPushUnavailable(reason) {
  const btn = document.getElementById('notif-btn');
  if (!btn) return;
  btn.style.display = '';
  btn.disabled = true;
  btn.classList.remove('subscribed');
  btn.title = reason;
}

async function initPush() {
  const btn = document.getElementById('notif-btn');
  if (!btn) return;
  btn.style.display = '';

  if (!window.isSecureContext) {
    setPushUnavailable('推送通知需要 HTTPS，或通过 localhost 访问。');
    return;
  }
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    setPushUnavailable('当前浏览器不支持 Web Push 通知。');
    return;
  }

  try {
    await navigator.serviceWorker.register('/sw.js');
    const res = await fetch('/api/push/vapid-public-key');
    if (!res.ok) {
      setPushUnavailable('Web Push 暂不可用，请确认服务端已安装 pywebpush。');
      return;
    }
    const { publicKey } = await res.json();
    _vapidPublicKey = publicKey;
    btn.disabled = false;
    const reg = await navigator.serviceWorker.ready;
    _pushSubscription = await reg.pushManager.getSubscription();
    updateNotifBtn();
  } catch (e) {
    setPushUnavailable(`推送初始化失败：${e.message || e}`);
  }
}

function updateNotifBtn() {
  const btn = document.getElementById('notif-btn');
  if (!btn || btn.disabled) return;
  if (_pushSubscription) {
    btn.classList.add('subscribed');
    btn.title = '已开启推送通知（点击关闭）';
  } else {
    btn.classList.remove('subscribed');
    btn.title = '开启推送通知';
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function togglePushSubscription() {
  if (!_vapidPublicKey) return;
  const btn = document.getElementById('notif-btn');
  if (btn?.disabled) return;
  const reg = await navigator.serviceWorker.ready;
  if (_pushSubscription) {
    await _pushSubscription.unsubscribe();
    await fetch('/api/push/unsubscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint: _pushSubscription.endpoint }),
    }).catch(() => {});
    _pushSubscription = null;
    updateNotifBtn();
    return;
  }
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    alert('需要通知权限才能接收推送。请在浏览器设置中允许通知。');
    return;
  }
  try {
    _pushSubscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(_vapidPublicKey),
    });
    await fetch('/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: _pushSubscription.toJSON() }),
    });
    updateNotifBtn();
  } catch (e) {
    alert('订阅推送失败：' + e.message);
  }
}
